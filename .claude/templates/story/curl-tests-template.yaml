# curl-tests.yaml —— planner 拆 case 时同步产出，evaluator 独立复跑判定 PASS/FAIL
#
# 路径约定（与 case 文件兄弟）：
#   .chatlabs/task/store/<story_id>/cases/<case_id>.tests.yaml
#
# 设计原则：
#   - 二元判定：所有用例通过 = PASS，任一失败 = FAIL，环境问题 = ERROR
#   - 断言能力刻意收窄：只支持 status + json 字段（等值 / {exists, type}）
#   - 复杂用例拆多条；禁止 jq 表达式 / 条件分支 / pre-request 脚本
#   - 每条 AC 至少 1 个用例；单 yaml 测试数 ≤ 8 条（超量拆 case）

case_id: STORY-123/CASE-01      # 必填，与 case-file 一致
base_url: ${BASE_URL}           # service_runner 注入实际 URL；通常不改
defaults:                        # 可省略；每个用例可覆盖
  headers:
    Content-Type: application/json
    # Authorization: ${AUTH_TOKEN}    # 通过环境变量注入

tests:
  # 示例 1：正常路径——创建成功
  - name: AC-001-create-201
    ac: AC-001                   # 必填，关联 contract.md §5 AC-NNN
    request:
      method: POST
      path: /api/v1/users
      body:
        name: alice
        email: alice@example.com
    expect:
      status: 201
      json:
        $.id: {exists: true, type: string}      # 字段存在 + 类型断言
        $.status: pending                        # 字段等值断言
    capture:                     # 把响应字段抓进 context，下一用例可 ${user_id}
      user_id: $.id

  # 示例 2：业务规则——重复创建 409
  - name: AC-002-duplicate-409
    ac: AC-002
    request:
      method: POST
      path: /api/v1/users
      body:
        name: alice
        email: alice@example.com
    expect:
      status: 409
      json:
        $.code: ERR_NAME_DUPLICATED

  # 示例 3：依赖前置用例——查询详情
  - name: AC-003-get-by-id
    ac: AC-003
    depends_on: AC-001-create-201    # 缺省按 yaml 顺序；显式声明=前置失败则本条 skipped
    request:
      method: GET
      path: /api/v1/users/${user_id}  # 引用 capture context
    expect:
      status: 200
      json:
        $.name: alice
